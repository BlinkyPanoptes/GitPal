[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gitpal"
version = "0.4.0"
description = "A desktop assistant for everyday Git and GitHub tasks, built with Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7",
]

[project.gui-scripts]
gitpal = "gui:main"
